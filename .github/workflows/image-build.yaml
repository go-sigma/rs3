name: Image CI

on:
  push:
    branches:
      - main

jobs:
  image-build:
    name: image-build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: tosone
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build rs3
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/go-sigma/rs3:latest-${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: "type=registry,force-compression=true,oci-mediatypes=true"
  merge-multi-arch:
    name: merge-multi-arch
    runs-on: ubuntu-24.04
    needs: [image-build]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: tosone
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Create and push multi-arch manifest for rs3
        run: |
          docker buildx imagetools create \
            -t ghcr.io/go-sigma/rs3:latest \
            ghcr.io/go-sigma/rs3:latest-amd64 \
            ghcr.io/go-sigma/rs3:latest-arm64
